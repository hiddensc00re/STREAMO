services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: streamo
      POSTGRES_PASSWORD: streamo
      POSTGRES_DB: streamo
    ports:
      - "5432:5432"
    volumes:
      - streamo_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamo -d streamo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  streamo_pg:
